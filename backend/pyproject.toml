[project]
name = "aaktt-backend"
version = "0.1.0"
description = "AAKTT+ backend: concept graphs, knowledge tracing, adaptive tutoring"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# Tools used only while developing, never shipped with the app.
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# --- Tool configuration lives here so there's one place to look ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, B: common bug patterns, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
